services:
  db:
    image: mysql:8.0
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_ordering
      MYSQL_USER: food_ordering
      MYSQL_PASSWORD: food_ordering
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    command: ["/app/wait-for-it.sh", "db:3306", "--", "/app/food-api"]
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=config.yaml
    volumes:
      - ./coupons:/app/coupons

volumes:
  mysql_data: